<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สั่งอาหาร - โต๊ะ 03</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; scroll-behavior: smooth; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .scroll-mt-section { scroll-margin-top: 135px; } 
    </style>
</head>
<body class="pb-32 text-slate-800 relative">

    <!-- ======================================================= -->
    <!-- CUSTOM ALERT POPUP -->
    <!-- ======================================================= -->
    <div id="custom-alert" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] hidden flex items-center justify-center opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full transform scale-95 transition-transform duration-300" id="custom-alert-box">
            <div class="text-center">
                <div id="alert-icon" class="w-16 h-16 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
                    <i class="fas fa-bell"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-2" id="alert-title">แจ้งเตือน</h3>
                <p class="text-slate-600 text-[15px] mb-6 leading-relaxed" id="alert-message">ข้อความ</p>
                <button onclick="closeCustomAlert()" id="alert-btn" class="w-full text-white font-bold py-3.5 rounded-xl shadow-md transition-colors">ตกลง</button>
            </div>
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- MODAL: BANNER DETAIL -->
    <!-- ======================================================= -->
    <div id="banner-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden flex items-center justify-center opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-white w-full max-w-md mx-auto rounded-3xl flex flex-col max-h-[90vh] shadow-2xl transform scale-95 transition-transform duration-300 relative overflow-hidden" id="banner-modal-box">
            <button onclick="closeBannerModal()" class="absolute top-3 right-3 w-8 h-8 bg-white/40 backdrop-blur-md text-slate-800 rounded-full flex items-center justify-center hover:bg-white/60 z-10 shadow-sm">
                <i class="fas fa-times"></i>
            </button>
            <div class="w-full flex-shrink-0 bg-slate-100">
                <img id="banner-modal-img" src="" class="w-full h-auto object-cover">
            </div>
            <div class="overflow-y-auto p-5 flex-1 bg-white text-slate-700 text-[14px] leading-relaxed whitespace-pre-line" id="banner-modal-detail">
            </div>
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- HEADER (Sticky) -->
    <!-- ======================================================= -->
    <header class="bg-white shadow-sm sticky top-0 z-40 h-16 flex items-center border-b border-slate-100">
        <div class="px-4 w-full flex justify-between items-center max-w-md mx-auto">
            <div>
                <h1 class="text-xl font-bold text-emerald-700 leading-tight">Terra Bite</h1>
                <p class="text-[11px] text-slate-500 font-medium">Dine-in Order</p>
            </div>
            <div class="flex items-center gap-2">
                <div class="bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-lg text-sm font-bold border border-emerald-100 flex flex-col items-center leading-none shadow-sm" id="table-badge">
                    <span class="text-[10px] font-normal text-emerald-600 mb-0.5">หมายเลขโต๊ะ</span>
                    <span id="table-number-text">03</span>
                </div>
                <button onclick="requestBill(event)" class="bg-slate-800 text-white px-3 py-2 rounded-lg text-[13px] font-bold hover:bg-slate-700 transition-colors flex items-center gap-1.5 shadow-sm">
                    <i class="fas fa-file-invoice-dollar text-emerald-400"></i> เช็คบิล
                </button>
            </div>
        </div>
    </header>

    <!-- ======================================================= -->
    <!-- BANNERS 16:5 -->
    <!-- ======================================================= -->
    <div id="banner-container" class="max-w-md mx-auto relative overflow-hidden bg-slate-100 hidden z-10">
        <div id="banner-slider" class="flex transition-transform duration-500 ease-in-out">
        </div>
        <div id="banner-indicators" class="absolute bottom-2 left-0 right-0 flex justify-center gap-1.5 z-10"></div>
    </div>

    <!-- ======================================================= -->
    <!-- CATEGORY MENU (Sticky) -->
    <!-- ======================================================= -->
    <div id="category-wrapper" class="bg-white/95 backdrop-blur-md border-b border-emerald-50 shadow-[0_4px_10px_rgba(0,0,0,0.03)] sticky top-16 z-30">
        <div class="px-4 py-3 flex gap-2.5 overflow-x-auto hide-scrollbar max-w-md mx-auto" id="category-container">
            <!-- หมวดหมู่ -->
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- COUPON SHOWCASE -->
    <!-- ======================================================= -->
    <div class="max-w-md mx-auto px-4 py-4 hidden bg-white shadow-sm border-b border-emerald-50" id="coupon-showcase-container">
        <h3 class="font-bold text-sm text-slate-700 mb-3"><i class="fas fa-ticket-alt text-amber-500 mr-1"></i> โค้ดส่วนลดพิเศษ</h3>
        <div class="flex gap-3 overflow-x-auto hide-scrollbar pb-2" id="coupon-showcase"></div>
    </div>

    <!-- ======================================================= -->
    <!-- MAIN MENU LIST -->
    <!-- ======================================================= -->
    <main class="max-w-md mx-auto px-4 pb-10" id="menu-container">
        <div class="text-center py-10 text-slate-400"><i class="fas fa-spinner fa-spin text-2xl mb-2"></i><p>กำลังโหลดเมนู...</p></div>
    </main>

    <!-- ======================================================= -->
    <!-- FLOATING BUTTONS (Call Staff & Cart) -->
    <!-- ======================================================= -->
    <div class="fixed bottom-[88px] right-4 z-20">
        <button onclick="callStaff(event)" class="bg-amber-500 text-white w-12 h-12 rounded-full shadow-[0_4px_15px_rgba(245,158,11,0.4)] flex items-center justify-center hover:bg-amber-600 transition-colors border-2 border-white">
            <i class="fas fa-bell text-xl"></i>
        </button>
    </div>

    <div id="cart-bar" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto transition-transform duration-300 transform translate-y-[150%] z-40" onclick="openCartModal()">
        <button class="w-full bg-emerald-600 text-white rounded-full shadow-[0_8px_20px_rgba(5,150,105,0.3)] px-1.5 py-1.5 flex justify-between items-center hover:bg-emerald-700 transition-colors">
            <div class="bg-white text-emerald-600 w-11 h-11 rounded-full flex items-center justify-center font-bold shadow-sm text-lg" id="cart-count">0</div>
            <span class="font-bold text-[17px] flex-1 text-center">ดูตะกร้าของคุณ</span>
            <div class="font-bold text-[17px] pr-5">฿<span id="cart-total">0</span></div>
        </button>
    </div>

    <!-- ======================================================= -->
    <!-- MODAL: CART -->
    <!-- ======================================================= -->
    <div id="cart-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex flex-col justify-end">
        <div class="bg-[#f8fafc] w-full max-w-md mx-auto rounded-t-3xl flex flex-col max-h-[90vh] slide-up shadow-2xl">
            <div class="p-4 border-b border-emerald-50 flex justify-between items-center bg-white rounded-t-3xl sticky top-0 z-20">
                <h3 class="font-bold text-lg text-slate-800"><i class="fas fa-shopping-basket text-emerald-600 mr-2"></i>สรุปออเดอร์ (โต๊ะ <span class="table-modal-num"></span>)</h3>
                <button onclick="closeCartModal()" class="w-8 h-8 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center hover:bg-slate-200"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="overflow-y-auto p-4 flex-1 space-y-3" id="cart-items-container"></div>

            <div class="p-4 bg-white border-t border-emerald-50 sticky bottom-0 z-20 shadow-[0_-4px_15px_rgba(0,0,0,0.03)]">
                <div class="flex gap-2 mb-3">
                    <input type="text" id="table-coupon-input" placeholder="พิมพ์โค้ดส่วนลด..." class="w-full p-3 border border-slate-200 rounded-xl text-[16px] uppercase outline-none focus:border-emerald-500 bg-slate-50 transition-colors">
                    <button onclick="applyTableCoupon()" class="bg-slate-800 text-white px-5 py-3 rounded-xl text-sm font-bold whitespace-nowrap shadow-sm hover:bg-slate-900">ใช้คูปอง</button>
                </div>
                <div id="table-discount-row" class="flex justify-between items-center mb-3 text-sm text-emerald-600 hidden bg-emerald-50 px-3 py-2 rounded-lg border border-emerald-100">
                    <span><i class="fas fa-ticket-alt"></i> ส่วนลด <span id="table-applied-coupon-text" class="font-bold"></span></span>
                    <span class="font-bold">- ฿<span id="table-cart-discount">0</span></span>
                </div>

                <div class="flex justify-between items-center mb-4 px-1">
                    <span class="text-slate-500 font-medium text-sm">รวมสุทธิ (<span id="modal-cart-count">0</span> รายการ)</span>
                    <span class="text-2xl font-bold text-emerald-600">฿<span id="modal-cart-total">0</span></span>
                </div>
                
                <button onclick="submitDineInOrder()" id="btn-submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-bold text-lg shadow-[0_4px_12px_rgba(5,150,105,0.25)] flex justify-center items-center gap-2 transition-colors">
                    ยืนยันออเดอร์เข้าครัว <i class="fas fa-utensils"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- MODAL: OPTION SELECTION -->
    <!-- ======================================================= -->
    <div id="option-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex flex-col justify-end">
        <div class="bg-white w-full max-w-md mx-auto rounded-t-3xl flex flex-col max-h-[90vh] slide-up shadow-2xl">
            <div class="relative w-full h-48 bg-slate-100 rounded-t-3xl overflow-hidden">
                <img id="modal-item-img" src="" class="w-full h-full object-cover">
                <button onclick="closeOptionModal()" class="absolute top-4 right-4 w-8 h-8 bg-black/40 backdrop-blur text-white rounded-full flex items-center justify-center hover:bg-black/60 z-10"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="p-4 border-b border-slate-100 bg-white sticky top-0 z-10 shadow-sm">
                <h3 class="font-bold text-xl text-slate-800 leading-tight" id="modal-item-name">ชื่อเมนู</h3>
                <p class="text-emerald-600 font-bold text-lg mt-1">฿<span id="modal-base-price">0</span></p>
            </div>

            <div class="overflow-y-auto p-4 space-y-6 flex-1 bg-slate-50 pb-20" id="modal-options-container"></div>

            <div class="p-4 bg-white border-t border-slate-100 sticky bottom-0 z-10">
                <button onclick="addItemToCart()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-bold text-lg flex justify-between items-center px-6 shadow-md transition-colors">
                    <span>เพิ่มลงตะกร้า</span>
                    <span>฿<span id="modal-total-price">0</span></span>
                </button>
            </div>
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- JAVASCRIPT & FIREBASE -->
    <!-- ======================================================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query, orderBy, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsgcKhn0V1lYjF754aypxZv5C-PmHCvno",
            authDomain: "mobile-first-5543c.firebaseapp.com",
            projectId: "mobile-first-5543c",
            storageBucket: "mobile-first-5543c.firebasestorage.app",
            messagingSenderId: "375984636440",
            appId: "1:375984636440:web:685692699c3320e201f96d"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const TABLE_NUMBER = urlParams.get('table') || "03"; 
        
        document.getElementById('table-number-text').innerText = TABLE_NUMBER;
        document.querySelector('.table-modal-num').innerText = TABLE_NUMBER;
        document.title = `สั่งอาหาร - โต๊ะ ${TABLE_NUMBER}`;
        
        let cart = [];
        let allMenus = []; 
        let allCategories = [];
        let currentCategory = 'all'; // ตัวแปรเก็บหมวดหมู่ที่เลือก (เริ่มต้นคือ 'ทั้งหมด')
        
        let currentItemSelecting = null;
        let currentItemBasePrice = 0;

        let allCoupons = [];
        let appliedDiscount = 0;
        let appliedCouponCode = '';

        let allBanners = [];
        let bannerIndex = 0;
        let bannerInterval;

        // 🟢 ฟังก์ชัน Custom Alert
        window.showCustomAlert = (msg, type = 'info') => {
            const titleEl = document.getElementById('alert-title');
            const msgEl = document.getElementById('alert-message');
            const icon = document.getElementById('alert-icon');
            const btn = document.getElementById('alert-btn');
            
            msgEl.innerText = msg;
            
            if(type === 'success') {
                titleEl.innerText = "สำเร็จ!";
                icon.className = 'w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl mx-auto mb-4';
                icon.innerHTML = '<i class="fas fa-check"></i>';
                btn.className = 'w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-md hover:bg-emerald-700 transition-colors';
            } else if(type === 'error') {
                titleEl.innerText = "ข้อผิดพลาด";
                icon.className = 'w-16 h-16 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-3xl mx-auto mb-4';
                icon.innerHTML = '<i class="fas fa-times"></i>';
                btn.className = 'w-full bg-rose-600 text-white font-bold py-3.5 rounded-xl shadow-md hover:bg-rose-700 transition-colors';
            } else {
                titleEl.innerText = "แจ้งเตือน";
                icon.className = 'w-16 h-16 rounded-full bg-amber-100 text-amber-500 flex items-center justify-center text-3xl mx-auto mb-4';
                icon.innerHTML = '<i class="fas fa-bell"></i>';
                btn.className = 'w-full bg-amber-500 text-white font-bold py-3.5 rounded-xl shadow-md hover:bg-amber-600 transition-colors';
            }
            
            const modal = document.getElementById('custom-alert');
            const box = document.getElementById('custom-alert-box');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }

        window.closeCustomAlert = () => {
            const modal = document.getElementById('custom-alert');
            const box = document.getElementById('custom-alert-box');
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        // 🟢 ฟังก์ชันหน้าต่างรายละเอียดป้ายโฆษณา (Banner Modal)
        window.showBannerDetail = (id) => {
            const b = allBanners.find(x => x.id === id);
            if(b && b.detail) {
                document.getElementById('banner-modal-img').src = b.imgUrl;
                document.getElementById('banner-modal-detail').innerText = b.detail; 
                
                const modal = document.getElementById('banner-modal');
                const box = document.getElementById('banner-modal-box');
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    box.classList.remove('scale-95');
                    box.classList.add('scale-100');
                }, 10);
            }
        };

        window.closeBannerModal = () => {
            const modal = document.getElementById('banner-modal');
            const box = document.getElementById('banner-modal-box');
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        };

        // 🟢 ระบบดึงป้ายโฆษณา (เรียงตามล่าสุดที่สร้าง)
        const qBanner = query(collection(db, "banners"), orderBy("created_at", "desc"));
        onSnapshot(qBanner, (snapshot) => {
            allBanners = [];
            const now = new Date();
            snapshot.forEach(doc => {
                const b = doc.data();
                if (b.startDate && new Date(b.startDate) > now) return;
                if (b.endDate && new Date(b.endDate) < now) return;
                allBanners.push({ id: doc.id, ...b });
            });
            window.renderBanners();
        });

        window.renderBanners = () => {
            const container = document.getElementById('banner-container');
            const slider = document.getElementById('banner-slider');
            const indicators = document.getElementById('banner-indicators');
            
            if (allBanners.length === 0) {
                container.classList.add('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            
            slider.innerHTML = allBanners.map(b => `
                <div class="w-full flex-shrink-0 relative cursor-pointer" onclick="window.showBannerDetail('${b.id}')">
                    <img src="${b.imgUrl}" class="w-full object-cover" style="aspect-ratio: 16/5;">
                </div>
            `).join('');

            indicators.innerHTML = allBanners.map((_, i) => `
                <div class="w-1.5 h-1.5 rounded-full transition-colors ${i === 0 ? 'bg-white' : 'bg-white/50 shadow'}"></div>
            `).join('');

            clearInterval(bannerInterval);
            bannerIndex = 0;
            
            if (allBanners.length > 1) {
                const timer = (allBanners[0].timer || 3) * 1000;
                bannerInterval = setInterval(window.nextBanner, timer);
            }
        };

        window.nextBanner = () => {
            if(allBanners.length <= 1) return;
            bannerIndex = (bannerIndex + 1) % allBanners.length;
            window.updateBannerView();
        };

        window.updateBannerView = () => {
            const slider = document.getElementById('banner-slider');
            const indicators = document.getElementById('banner-indicators');
            if(slider) slider.style.transform = `translateX(-${bannerIndex * 100}%)`;
            
            if(indicators) {
                Array.from(indicators.children).forEach((ind, i) => {
                    ind.className = `w-1.5 h-1.5 rounded-full transition-colors ${i === bannerIndex ? 'bg-white' : 'bg-white/50 shadow'}`;
                });
            }

            clearInterval(bannerInterval);
            const timer = (allBanners[bannerIndex].timer || 3) * 1000;
            bannerInterval = setInterval(window.nextBanner, timer);
        };

        // 🟢 ระบบคูปอง
        const isCouponValid = (c) => {
            if(c.active === false) return false;
            const now = new Date();
            if (c.startDate && new Date(c.startDate) > now) return false;
            if (c.endDate && new Date(c.endDate) < now) return false;
            if (c.usageLimit && c.usageLimit > 0 && (c.usedCount || 0) >= c.usageLimit) return false;
            return true;
        };

        onSnapshot(collection(db, "coupons"), (snapshot) => {
            allCoupons = [];
            snapshot.forEach(doc => allCoupons.push({ id: doc.id, ...doc.data() }));
            window.renderCouponsShowcase(); 
        });

        window.renderCouponsShowcase = () => {
            const container = document.getElementById('coupon-showcase');
            const wrapper = document.getElementById('coupon-showcase-container');
            const visibleCoupons = allCoupons.filter(c => c.visibility === 'show' && isCouponValid(c));
            
            if(visibleCoupons.length === 0) {
                wrapper.classList.add('hidden');
                return;
            }
            
            wrapper.classList.remove('hidden');
            container.innerHTML = visibleCoupons.map(c => `
                <div class="bg-gradient-to-r from-emerald-500 to-teal-500 rounded-xl p-3 text-white min-w-[200px] flex-shrink-0 shadow-md relative overflow-hidden">
                    <div class="absolute -right-4 -top-4 w-12 h-12 bg-white/20 rounded-full"></div>
                    <div class="absolute -right-4 -bottom-4 w-16 h-16 bg-white/10 rounded-full"></div>
                    <h4 class="font-bold text-lg mb-0 tracking-wide">${c.code}</h4>
                    <p class="text-[11px] text-emerald-50 mb-3 opacity-90">ส่วนลด ${c.value}${c.type === 'percent' ? '%' : ' บาท'}</p>
                    <button onclick="autoApplyCoupon('${c.code}')" class="bg-white text-emerald-700 text-xs font-bold px-3 py-1.5 rounded-lg w-full hover:bg-slate-50 transition-colors shadow-sm relative z-10">
                        เก็บคูปอง / ใช้เลย
                    </button>
                </div>
            `).join('');
        };

        window.autoApplyCoupon = (code) => {
            document.getElementById('table-coupon-input').value = code;
            if (cart.length > 0) {
                applyTableCoupon();
            } else {
                window.showCustomAlert(`เก็บโค้ด ${code} สำเร็จ! กรุณาเลือกเมนูลงตะกร้าก่อนระบบจึงจะคำนวณส่วนลดให้`, 'info');
            }
        };

        // 🟢 ดึงเมนูและแยกหมวดหมู่ (ดึงเรียงตามเก่าไปใหม่ asc)
        const qMenu = query(collection(db, "menu_items"), orderBy("created_at", "asc"));
        onSnapshot(qMenu, (snapshot) => {
            allMenus = [];
            allCategories = [];

            snapshot.forEach((docSnap) => {
                const item = { id: docSnap.id, ...docSnap.data() };
                allMenus.push(item);
                const cat = item.category || 'ไม่มีหมวดหมู่';
                if(!allCategories.includes(cat)) {
                    allCategories.push(cat);
                }
            });
            window.renderCategoryFilters();
            window.renderMenus();
        });

        // 🟢 ระบบกรองหมวดหมู่เมื่อกด
        window.setCategory = (cat) => {
            currentCategory = cat;
            window.renderCategoryFilters();
            window.renderMenus();
            window.scrollTo({ top: document.getElementById('category-wrapper').offsetTop - 64, behavior: 'smooth' });
        };

        window.renderCategoryFilters = () => {
            const container = document.getElementById('category-container');
            if(!container) return;
            
            // ปุ่ม "ทั้งหมด"
            let html = `<button onclick="window.setCategory('all')" class="px-5 py-2 rounded-full text-[14px] font-bold whitespace-nowrap transition-colors shadow-sm ${currentCategory === 'all' ? 'bg-emerald-600 text-white hover:bg-emerald-700' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}">ทั้งหมด</button>`;
            
            // ปุ่มหมวดหมู่อื่นๆ
            allCategories.forEach(c => {
                const isActive = currentCategory === c;
                html += `<button onclick="window.setCategory('${c}')" class="px-5 py-2 rounded-full text-[14px] font-bold whitespace-nowrap transition-colors shadow-sm ${isActive ? 'bg-emerald-600 text-white hover:bg-emerald-700' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}">${c}</button>`;
            });
            container.innerHTML = html;
        };

        window.renderMenus = () => {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            
            if (allMenus.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-slate-400">ไม่มีเมนู</div>';
                return;
            }

            const categoriesToRender = currentCategory === 'all' ? allCategories : [currentCategory];

            categoriesToRender.forEach(cat => {
                const catItems = allMenus.filter(m => (m.category || 'ไม่มีหมวดหมู่') === cat);
                if (catItems.length > 0) {
                    const catId = `section-${cat.replace(/\s+/g, '-')}`;
                    let sectionHtml = `
                        <div id="${catId}" class="pt-5 pb-2">
                            <div class="flex items-center mb-3">
                                <div class="w-1.5 h-6 bg-emerald-600 mr-2.5 rounded-full"></div>
                                <h2 class="text-[19px] font-bold text-slate-800">${cat}</h2>
                            </div>
                            <div class="grid grid-cols-1 gap-4">
                    `;
                    
                    catItems.forEach(item => {
                        const hasOptions = item.options && item.options.length > 0;
                        const isOutOfStock = item.stock !== undefined && item.stock !== null && item.stock <= 0;
                        
                        let badgeBg = 'bg-emerald-600'; 
                        if(item.badge && item.badge.toLowerCase().includes('low')) badgeBg = 'bg-amber-500'; 
                        if(isOutOfStock) badgeBg = 'bg-slate-500';
                        
                        const badgeHtml = item.badge ? `<span class="absolute top-0 left-0 ${badgeBg} text-white text-[10px] font-bold px-2 py-1 rounded-tl-xl rounded-br-xl shadow-sm z-10 tracking-wide">${item.badge}</span>` : '';
                        
                        const btnHtml = isOutOfStock
                            ? `<button disabled class="px-5 py-1.5 rounded-full bg-slate-100 text-slate-400 font-bold text-[13px] cursor-not-allowed">สินค้าหมด</button>`
                            : `<button onclick="window.openOptionModal('${item.id}')" class="px-5 py-1.5 rounded-full bg-emerald-50 text-emerald-600 font-bold text-[14px] hover:bg-emerald-100 transition-colors">เลือก</button>`;
                        
                        sectionHtml += `
                            <div class="bg-white rounded-2xl p-3 shadow-sm border border-emerald-50 flex gap-4 relative overflow-hidden ${isOutOfStock ? 'opacity-60 grayscale-[40%]' : 'hover:shadow-md cursor-pointer transition-shadow'}" 
                                ${isOutOfStock ? '' : `onclick="window.openOptionModal('${item.id}')"`}>
                                
                                <div class="relative w-[100px] h-[100px] flex-shrink-0">
                                    ${badgeHtml}
                                    <img src="${item.img}" class="w-full h-full object-cover rounded-xl bg-slate-50 border border-slate-100">
                                </div>

                                <div class="flex-1 flex flex-col justify-between py-1 pr-1">
                                    <div>
                                        <h3 class="font-bold text-[16px] leading-tight mb-1" style="color: ${isOutOfStock ? '#94a3b8' : '#1e293b'};">${item.name}</h3>
                                        ${hasOptions && !isOutOfStock ? `<p class="text-[11px] text-amber-500 font-medium"><i class="fas fa-sliders-h mr-1"></i>ปรับแต่งได้</p>` : ''}
                                    </div>
                                    <div class="flex justify-between items-end mt-2">
                                        <span class="font-bold text-[18px] tracking-tight ${isOutOfStock ? 'text-slate-400' : 'text-emerald-600'}">฿${item.price}</span>
                                        ${btnHtml}
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    sectionHtml += `</div></div>`;
                    container.innerHTML += sectionHtml;
                }
            });
            
            if (container.innerHTML === '') {
                 container.innerHTML = '<div class="text-center py-10 text-slate-400">ไม่มีเมนูในหมวดหมู่นี้</div>';
            }
        };

        // 🟢 ระบบจัดการหน้าต่าง Option
        window.openOptionModal = (itemId) => {
            const item = allMenus.find(m => m.id === itemId);
            if(!item) return;

            currentItemSelecting = item;
            currentItemBasePrice = item.price;

            document.getElementById('modal-item-img').src = item.img;
            document.getElementById('modal-item-name').innerText = item.name;
            document.getElementById('modal-base-price').innerText = item.price;
            document.getElementById('modal-total-price').innerText = item.price;
            
            const optionsContainer = document.getElementById('modal-options-container');
            optionsContainer.innerHTML = '';

            if (item.options && item.options.length > 0) {
                item.options.forEach(group => {
                    const isSingle = group.type === 'single';
                    const inputType = isSingle ? 'radio' : 'checkbox';
                    const reqBadge = isSingle ? `<span class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded font-bold ml-2">จำเป็น</span>` : `<span class="text-[10px] text-slate-400 font-normal ml-2">เลือกได้หลายข้อ</span>`;
                    
                    let choicesHTML = '';
                    group.choices.forEach((choice, index) => {
                        const priceTag = choice.price > 0 ? `<span class="text-sm text-slate-600 font-medium">+฿${choice.price}</span>` : '';
                        const checked = (isSingle && index === 0) ? 'checked' : ''; 
                        
                        choicesHTML += `
                            <label class="flex justify-between items-center p-3.5 bg-white border border-slate-100 rounded-xl mb-2 cursor-pointer hover:border-emerald-300 transition-colors shadow-sm">
                                <div class="flex items-center gap-3">
                                    <input type="${inputType}" name="opt_${group.id}" value="${choice.name}" data-price="${choice.price}" ${checked} onchange="window.calculateModalPrice()"
                                        class="w-5 h-5 text-emerald-600 focus:ring-emerald-500 ${isSingle ? 'rounded-full' : 'rounded'}">
                                    <span class="text-slate-700 text-[15px]">${choice.name}</span>
                                </div>
                                ${priceTag}
                            </label>
                        `;
                    });

                    optionsContainer.innerHTML += `
                        <div>
                            <div class="flex items-center mb-3">
                                <h4 class="font-bold text-slate-800 text-base">${group.title}</h4>
                                ${reqBadge}
                            </div>
                            ${choicesHTML}
                        </div>
                    `;
                });
            }

            optionsContainer.innerHTML += `
                <div>
                    <h4 class="font-bold text-slate-800 text-base mb-2">หมายเหตุถึงร้าน (Optional)</h4>
                    <textarea id="special-note" rows="2" placeholder="เช่น ไม่ใส่ผัก, ขอช้อนส้อม, เผ็ดน้อย..." class="w-full p-3 border border-slate-200 rounded-xl text-[16px] focus:border-emerald-500 outline-none bg-white"></textarea>
                </div>
            `;

            document.getElementById('option-modal').classList.remove('hidden');
        };

        window.closeOptionModal = () => document.getElementById('option-modal').classList.add('hidden');

        window.calculateModalPrice = () => {
            let addOnTotal = 0;
            document.querySelectorAll('#modal-options-container input:checked').forEach(input => {
                addOnTotal += parseFloat(input.getAttribute('data-price') || 0);
            });
            document.getElementById('modal-total-price').innerText = currentItemBasePrice + addOnTotal;
        };

        // 🟢 ระบบตะกร้า & คูปอง 
        window.addItemToCart = () => {
            let selectedOptions = [];
            let addOnPrice = 0;

            document.querySelectorAll('#modal-options-container input:checked').forEach(input => {
                selectedOptions.push(input.value);
                addOnPrice += parseFloat(input.getAttribute('data-price') || 0);
            });

            const note = document.getElementById('special-note').value;
            if (note.trim() !== '') selectedOptions.push(`หมายเหตุ: ${note}`);

            const optionsStr = selectedOptions.join(', ');
            const finalPrice = currentItemBasePrice + addOnPrice;

            const existingItem = cart.find(i => i.id === currentItemSelecting.id && i.optionsText === optionsStr);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({
                    id: currentItemSelecting.id,
                    name: currentItemSelecting.name,
                    price: finalPrice,
                    optionsText: optionsStr,
                    qty: 1
                });
            }

            window.closeOptionModal();
            if (document.getElementById('table-coupon-input').value.trim() !== '') {
                applyTableCoupon(false); 
            } else {
                updateCartUI();
            }
        };

        window.openCartModal = () => {
            document.getElementById('cart-modal').classList.remove('hidden');
            renderCartItems();
        };
        
        window.closeCartModal = () => document.getElementById('cart-modal').classList.add('hidden');

        window.renderCartItems = () => {
            const container = document.getElementById('cart-items-container');
            if(cart.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-slate-400"><i class="fas fa-shopping-basket text-4xl mb-3 text-slate-200"></i><p>ยังไม่มีเมนูในตะกร้า</p></div>';
                setTimeout(() => closeCartModal(), 500); 
                return;
            }
            
            container.innerHTML = cart.map((item, index) => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-50 flex flex-col gap-3">
                    <div class="flex justify-between items-start">
                        <div class="flex-1 pr-3">
                            <h4 class="font-bold text-slate-800 text-[15px] leading-tight">${item.name}</h4>
                            ${item.optionsText ? `<p class="text-[12px] text-slate-500 mt-1"><span class="text-emerald-600 font-medium">ตัวเลือก:</span> ${item.optionsText}</p>` : ''}
                        </div>
                        <div class="text-slate-800 font-bold text-[15px]">฿${item.price * item.qty}</div>
                    </div>
                    <div class="flex justify-between items-center mt-1 pt-3 border-t border-slate-50">
                        <button onclick="removeFromCart(${index})" class="text-rose-400 hover:text-rose-600 bg-rose-50 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors">
                            <i class="fas fa-trash"></i> เอาออก
                        </button>
                        <div class="flex items-center gap-3 bg-slate-50 rounded-full p-1 border border-slate-100">
                            <button onclick="updateQty(${index}, -1)" class="w-8 h-8 flex items-center justify-center bg-white rounded-full shadow-sm text-slate-600 font-bold text-lg">-</button>
                            <span class="text-[15px] font-bold w-4 text-center">${item.qty}</span>
                            <button onclick="updateQty(${index}, 1)" class="w-8 h-8 flex items-center justify-center bg-white rounded-full shadow-sm text-emerald-600 font-bold text-lg">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
            
            updateCartUI(); 
        };

        window.updateQty = (index, delta) => {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            if (appliedCouponCode) applyTableCoupon(false);
            updateCartUI();
            renderCartItems();
        };

        window.removeFromCart = (index) => {
            cart.splice(index, 1);
            if (appliedCouponCode) applyTableCoupon(false);
            updateCartUI();
            renderCartItems();
        };

        window.applyTableCoupon = (showAlert = true) => {
            const code = document.getElementById('table-coupon-input').value.trim().toUpperCase();
            if(!code) return;
            const coupon = allCoupons.find(c => c.code === code);
            
            if(!coupon || !isCouponValid(coupon)) {
                if(showAlert) window.showCustomAlert('คูปองไม่ถูกต้อง หมดเวลา หรือสิทธิ์เต็มแล้ว', 'error');
                document.getElementById('table-coupon-input').value = '';
                appliedCouponCode = '';
                updateCartUI();
                return;
            }

            const applicableItemsInCart = cart.filter(item => coupon.applicable_items.includes(item.id));
            if(applicableItemsInCart.length === 0) {
                if(showAlert) window.showCustomAlert('คูปองนี้ไม่สามารถใช้ร่วมกับเมนูในตะกร้าของคุณได้', 'error');
                return;
            }

            let subtotalForDiscount = applicableItemsInCart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            if (coupon.type === 'amount') {
                appliedDiscount = Math.min(coupon.value, subtotalForDiscount);
            } else {
                appliedDiscount = subtotalForDiscount * (coupon.value / 100);
            }
            appliedCouponCode = code;
            
            if(showAlert) window.showCustomAlert('ใช้คูปองส่วนลดสำเร็จ!', 'success');
            updateCartUI();
        };

        function updateCartUI() {
            const bar = document.getElementById('cart-bar');
            const totalQty = cart.reduce((sum, i) => sum + i.qty, 0);
            
            document.getElementById('cart-count').innerText = totalQty;
            document.getElementById('modal-cart-count').innerText = totalQty;
            
            const subtotal = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            
            if(appliedCouponCode) {
                const coupon = allCoupons.find(c => c.code === appliedCouponCode);
                if(coupon && isCouponValid(coupon)) {
                    const applicableItems = cart.filter(item => coupon.applicable_items.includes(item.id));
                    let subtotalForDiscount = applicableItems.reduce((sum, i) => sum + (i.price * i.qty), 0);
                    appliedDiscount = coupon.type === 'amount' ? Math.min(coupon.value, subtotalForDiscount) : subtotalForDiscount * (coupon.value / 100);
                } else {
                    appliedDiscount = 0;
                    appliedCouponCode = '';
                }
            } else {
                appliedDiscount = 0;
            }

            const finalTotal = subtotal - appliedDiscount;
            
            if(appliedDiscount > 0) {
                document.getElementById('table-discount-row').classList.remove('hidden');
                document.getElementById('table-cart-discount').innerText = appliedDiscount.toFixed(2);
                document.getElementById('table-applied-coupon-text').innerText = appliedCouponCode;
            } else {
                document.getElementById('table-discount-row').classList.add('hidden');
                appliedCouponCode = '';
            }

            const displayTotal = finalTotal > 0 ? finalTotal.toFixed(2) : '0';
            document.getElementById('cart-total').innerText = displayTotal;
            document.getElementById('modal-cart-total').innerText = displayTotal;
            
            if (cart.length > 0) {
                bar.classList.remove('translate-y-[150%]');
            } else {
                bar.classList.add('translate-y-[150%]');
                if (!document.getElementById('cart-modal').classList.contains('hidden')) {
                     closeCartModal();
                }
            }
        }

        // 🟢 ส่งออเดอร์
        window.submitDineInOrder = async () => {
            const btn = document.getElementById('btn-submit');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังส่ง...';
            btn.disabled = true;
            
            try {
                const subtotal = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
                const finalTotal = subtotal - appliedDiscount;
                
                const formattedItems = cart.map(item => ({
                    id: item.id,
                    name: item.name,
                    qty: item.qty,
                    price: item.price,
                    options: item.optionsText
                }));

                await addDoc(collection(db, "orders"), {
                    type: "dine-in",
                    table: TABLE_NUMBER,
                    items: formattedItems,
                    total: finalTotal > 0 ? finalTotal : 0,
                    discount: appliedDiscount,
                    couponCode: appliedCouponCode,
                    status: "รอคิว",
                    timestamp: serverTimestamp()
                });

                if(appliedCouponCode) {
                    const coupon = allCoupons.find(c => c.code === appliedCouponCode);
                    if(coupon) {
                        await updateDoc(doc(db, "coupons", coupon.id), { usedCount: increment(1) });
                    }
                }
                
                window.showCustomAlert(`ส่งออเดอร์ของ โต๊ะ ${TABLE_NUMBER} เข้าครัวสำเร็จ!`, 'success');
                cart = [];
                appliedDiscount = 0;
                appliedCouponCode = '';
                if(document.getElementById('table-coupon-input')) document.getElementById('table-coupon-input').value = '';
                updateCartUI();
                closeCartModal();
            } catch (e) {
                window.showCustomAlert("เกิดข้อผิดพลาดในการส่งข้อมูล: " + e.message, 'error');
            } finally {
                btn.innerHTML = 'ยืนยันออเดอร์เข้าครัว <i class="fas fa-utensils"></i>';
                btn.disabled = false;
            }
        };

        // 🟢 บริการเสริม (ปุ่มเรียกพนักงาน & เช็คบิล)
        window.callStaff = async (event) => {
            const btn = event.currentTarget;
            const origHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xl"></i>';
            btn.disabled = true;
            try {
                await addDoc(collection(db, "table_calls"), {
                    table: TABLE_NUMBER,
                    type: 'call',
                    timestamp: serverTimestamp()
                });
                window.showCustomAlert(`พนักงานได้รับแจ้งเตือนจาก โต๊ะ ${TABLE_NUMBER} แล้ว กรุณารอสักครู่ครับ`, 'info');
            } catch(e) {
                window.showCustomAlert('เกิดข้อผิดพลาดในการส่งแจ้งเตือน: ' + e.message, 'error');
            } finally {
                btn.innerHTML = origHTML;
                btn.disabled = false;
            }
        };

        window.requestBill = async (event) => {
            const btn = event.currentTarget;
            const origHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin text-emerald-400"></i>';
            btn.disabled = true;
            try {
                await addDoc(collection(db, "table_calls"), {
                    table: TABLE_NUMBER,
                    type: 'checkbill',
                    timestamp: serverTimestamp()
                });
                window.showCustomAlert(`รับทราบ! แคชเชียร์ได้รับการแจ้งเตือนของ โต๊ะ ${TABLE_NUMBER} เพื่อตรวจสอบและนำบิลมาให้แล้วครับ`, 'success');
            } catch(e) {
                window.showCustomAlert('เกิดข้อผิดพลาดในการเรียกเช็คบิล: ' + e.message, 'error');
            } finally {
                btn.innerHTML = origHTML;
                btn.disabled = false;
            }
        };

    </script>
</body>
</html>
